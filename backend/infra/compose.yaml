# compose.yaml: local infra for the backend. Step 5 adds one service at a time.
# Start: docker compose -f backend/infra/compose.yaml up -d
# Redpanda speaks the Kafka protocol on localhost:9092. Console is on http://localhost:8080.
# Postgres is on localhost:5433, because 5432 is often taken by a Postgres installed on the Mac.
# Valkey (Redis compatible) is on localhost:6379.
# SeaweedFS (S3 compatible, stands in for AWS S3) is on localhost:9000. MinIO no longer publishes images.
name: finebrain

services:
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333
    ports:
      - "9000:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8.0
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: finebrain
      POSTGRES_PASSWORD: finebrain  # local only, never used outside this container
      POSTGRES_DB: finebrain
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "finebrain"]
      interval: 5s
      retries: 12

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "9092:9092"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      retries: 12

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  postgres-data:
  s3-data:
