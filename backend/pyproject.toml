[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15.0",
    "boto3>=1.43.114",
    "confluent-kafka>=2.16.0",
    "fastapi[standard]>=0.142.4",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "temporalio>=1.34.0",
    "valkey>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
