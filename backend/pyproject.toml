[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.16.0",
    "fastapi[standard]>=0.142.4",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
